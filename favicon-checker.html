    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Which icon files does a site need?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A /favicon.ico for older browsers and tools, an SVG or 32x32 PNG linked with rel=\"icon\", a 180x180 apple-touch-icon for iOS, and a web manifest with 192x192 and 512x512 PNG icons for Android and installed apps."
            }
          },
          {
            "@type": "Question",
            "name": "Why does my old favicon still show?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Browsers cache favicons apart from the page and keep them for a long time. Change the file name, or add a query string to the href, so browsers fetch the new file."
            }
          },
          {
            "@type": "Question",
            "name": "What is a maskable icon?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "An icon with room around the logo, marked purpose \"maskable\" in the web manifest. Android crops it to the shape the device uses, like a circle or a rounded square. Keep the logo inside the center 80% of the image."
            }
          },
          {
            "@type": "Question",
            "name": "Where does iOS get the home screen icon?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "From the apple-touch-icon link. When the page links none, Safari asks for /apple-touch-icon.png at the root of the site. Use a 180x180 PNG."
            }
          },
          {
            "@type": "Question",
            "name": "Are the links I check saved?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. The page, its icons and its manifest are fetched when you press Check, and nothing is stored."
            }
          }
        ]
      }
