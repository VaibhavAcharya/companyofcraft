<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
  <title>stateofpixel</title>
  <style>
    .tile { fill: #171717; }
    .pixel { fill: #fafafa; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #ededed; }
      .pixel { fill: #000000; }
    }
  </style>
  <rect class="tile" width="20" height="20" rx="5" />
  <rect class="pixel" x="5" y="5" width="4" height="4" />
  <rect class="pixel" x="11" y="11" width="4" height="4" />
</svg>
