        "@context": "https://schema.org",

        }
      }

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What are Open Graph tags?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Meta tags in the head of a page, like og:title, og:description, og:image and og:url. Chat apps and social networks read them to build the preview card when someone shares the link. X also reads twitter: tags and uses the og: tags when they are missing."
            }
          },
          {
            "@type": "Question",
            "name": "Why does my link still show the old preview?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Platforms cache a preview after the first time someone shares a link. LinkedIn has a Post Inspector that fetches the page again. The others update when their cache expires."
            }
          },
          {
            "@type": "Question",
            "name": "What size should the og:image be?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "1200x630 pixels is the common size. It has the 1.91:1 shape of the large cards on X and LinkedIn, so nothing gets cropped. Keep the file under 5 MB."
            }
          },
          {
            "@type": "Question",
            "name": "Why does my image not show up?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Check that og:image is a full URL that starts with https://, that the image loads without signing in, and that the server sends it with an image content type. The checks above test the last two."
            }
          },
          {
            "@type": "Question",
            "name": "Are the links I check saved?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. The page and its image are fetched when you press Preview, and nothing is stored."
            }
          }
        ]
      }
    </script>
