    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is llms.txt?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A Markdown file at /llms.txt that lists the important pages of a site with a short summary of each. It was proposed at llmstxt.org. Agents read it to find the right page without crawling the whole site."
            }
          },
          {
            "@type": "Question",
            "name": "How do I block or allow an AI crawler?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Add a User-agent group for the crawler in robots.txt, with Disallow: / to block it or Allow: / to allow it. Crawlers that collect training data, like GPTBot and ClaudeBot, are separate from the ones that fetch a page when a person asks, like ChatGPT-User and Claude-User, so you can block one and allow the other."
            }
          },
          {
            "@type": "Question",
            "name": "Why serve a Markdown version of a page?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "An HTML page carries navigation, scripts and styles, and an agent pays for all of it in tokens. A Markdown copy has only the content. Serve it at the same path with .md at the end, link it with a link rel=\"alternate\" type=\"text/markdown\" tag, or return it when the request has Accept: text/markdown."
            }
          },
          {
            "@type": "Question",
            "name": "Do AI crawlers run JavaScript?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Many do not. If scripts add the text of a page, those crawlers see an empty page. Render the text on the server or at build time."
            }
          },
          {
            "@type": "Question",
            "name": "Are the links I check saved?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. The page and its files are fetched when you press Check, and nothing is stored."
            }
          }
        ]
      }
    </script>
