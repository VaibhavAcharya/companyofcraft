    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How do I check if a request comes from a real Googlebot or GPTBot?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Anyone can put Googlebot or GPTBot in a user agent. Google, Bing, Apple, OpenAI, Anthropic and Perplexity publish the IP ranges their crawlers use. A request is real when its IP is in those ranges. Call the API with the ip and ua of the request to check it."
            }
          },
          {
            "@type": "Question",
            "name": "Can it tell if someone uses a VPN?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Partly. Tor exit nodes are on a public list, so those are certain. VPNs and proxies mostly run on hosting networks like AWS, DigitalOcean, Hetzner or M247, so an IP from one of those is likely a VPN, a proxy or a server. A VPN on a home network looks like any home connection."
            }
          },
          {
            "@type": "Question",
            "name": "Why is my location a different city?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "An IP address belongs to a network, not a house. The location is where your internet provider says that network is, which can be the nearest big city. Mobile networks and VPNs can show a city far away."
            }
          },
          {
            "@type": "Question",
            "name": "Why is the city missing when I look up another IP?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The city comes from the network your request arrives through, so it is only known for your own IP. For other IPs the country comes from the regional internet registry."
            }
          },
          {
            "@type": "Question",
            "name": "Are the IPs I look up saved?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Nothing is stored."
            }
          }
        ]
      }
