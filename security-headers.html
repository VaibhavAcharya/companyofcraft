    <script type="application/ld+json">

        "@context": "https://schema.org",

        "mainEntity": [
          {
            "@type": "Question",
            "name": "What do security headers do?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "They are HTTP response headers that tell the browser what a page may do: where scripts can load from, whether other sites can put it in a frame, and whether to always use HTTPS. They protect visitors from attacks like cross-site scripting and clickjacking."
            }
          },
          {
            "@type": "Question",
            "name": "What is a good first Content-Security-Policy?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Start with default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none' and add the hosts your page loads from. Send it as Content-Security-Policy-Report-Only first, check the browser console for blocked requests, then switch to Content-Security-Policy."
            }
          },
          {
            "@type": "Question",
            "name": "Why is 'unsafe-inline' a problem?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It lets every inline script run, including one an attacker injects. Give the inline scripts you need a nonce or a hash instead. When a nonce or a hash is in script-src, browsers ignore 'unsafe-inline'."
            }
          },
          {
            "@type": "Question",
            "name": "Does a Content-Security-Policy in a meta tag work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Most of it does. Browsers ignore frame-ancestors, report-uri and sandbox in a meta tag, so send those in the header."
            }
          },
          {
            "@type": "Question",
            "name": "Are the links I check saved?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. The page is fetched when you press Check, and nothing is stored."
            }
          }
        ]
